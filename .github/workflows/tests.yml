name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-go@v5
        with:
          go-version: '1.19.x'
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Build native scanner
        run: make native
      - name: Run offline tests
        run: python -m pytest
      - name: Lint
        run: ruff check mgwiki_editor tests
      - name: Check formatting
        run: ruff format --check mgwiki_editor tests

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.19.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Build scanner
        run: make native
      - name: Go tests
        run: make test-native
      - name: Python wrapper tests
        run: python -m pytest tests/test_native.py
