[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgwiki-editor"
version = "0.1.0"
description = "Autonomous Malagasy Wikipedia translation sandbox harness"
readme = {file = "README.wiki", content-type = "text/plain"}
requires-python = ">=3.11"
dependencies = ["pywikibot>=10,<12", "mwparserfromhell>=0.6.6,<1"]

[project.urls]
Repository = "https://github.com/radomd92/mgwiki-editor"
Issues = "https://github.com/radomd92/mgwiki-editor/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
mgwiki-editor = "mgwiki_editor.cli:main"

[tool.setuptools.packages.find]
include = ["mgwiki_editor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
