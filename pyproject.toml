[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mgwiki-editor"
version = "0.1.0"
description = "Autonomous Malagasy Wikipedia translation sandbox harness"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["wikipedia", "malagasy", "translation", "mediawiki", "pywikibot", "opencode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Malagasy",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["pywikibot>=10,<12", "mwparserfromhell>=0.6.6,<1"]

[project.urls]
Homepage = "https://github.com/radomd92/mgwiki-editor"
Repository = "https://github.com/radomd92/mgwiki-editor"
Issues = "https://github.com/radomd92/mgwiki-editor/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
mgwiki-editor = "mgwiki_editor.cli:main"

[tool.setuptools.packages.find]
include = ["mgwiki_editor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
